<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSPlayground</title>
    <meta
      name="description"
      content="A two-pane JavaScript playground: write JavaScript in one pane, watch it run in the other — in a worker that can be killed."
    />
  </head>
  <body>
    <script>
      // The first frame belongs to the browser, not to React: a stylesheet cannot read
      // a preference, so a light theme used to show one frame of the dark default before
      // the app had drawn anything. `use-settings.ts` writes the chosen background here
      // under a key of its own — a colour, not a theme id, so this stays a line rather
      // than a second copy of the palette. No key yet means a first visit, and the
      // default in `index.css` is already the right answer for that.
      try {
        var bg = localStorage.getItem("jsplayground:bg");
        if (bg) document.documentElement.style.backgroundColor = bg;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script>
      // Served by the host, so in development it is a 404 in the console and nothing
      // else. The flag below is substituted at build time — this file has no module
      // scope to read `import.meta.env` from, and the build is the only place that knows.
      if (%PROD%) {
        var insights = document.createElement("script");
        insights.defer = true;
        insights.src = "/_vercel/insights/script.js";
        document.head.appendChild(insights);
      }
    </script>
  </body>
</html>
