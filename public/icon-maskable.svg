<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The favicon's mark, sized for a maskable slot: the background runs to the edges so
       a launcher may crop it into a circle or a squircle, and the chevron sits inside the
       central 60% that every mask is guaranteed to keep. -->
  <rect width="512" height="512" fill="#0a0a0b" />
  <g transform="translate(102.4 102.4) scale(9.6)">
    <path d="M9 10.5 14.5 16 9 21.5" fill="none" stroke="#7dd3a0" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M17.5 22h6" fill="none" stroke="#6b7280" stroke-width="2.6" stroke-linecap="round" />
  </g>
</svg>
